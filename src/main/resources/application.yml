spring:
    application:
        name: mifos_reporting
    datasource:
        driverClassName: org.h2.Driver
        password: ''
        jdbc-url: jdbc:h2:file:~/reports_db
        username: sa
    h2:
        console:
            enabled: true
            path: /h2-console
    jpa:
        database-platform: org.hibernate.dialect.H2Dialect
        hibernate:
            ddl-auto: update
        properties:
            hibernate:
                format_sql: true
        show-sql: true

report:
    datasource:
        driver-class-name: 'org.mariadb.jdbc.Driver'
        jdbc-url: jdbc:mariadb://localhost:3306/mifos
        password: root
        username: root
