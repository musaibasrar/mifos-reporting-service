<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Generate Report - Mifos Reporting Service</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a th:href="@{/}">Home</a></li>
                <li class="breadcrumb-item active" aria-current="page" th:text="${report.reportName}">Report Name</li>
            </ol>
        </nav>

        <h1 class="mb-4" th:text="${report.reportName}">Report Name</h1>
        
        <!-- Alert Messages -->
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div class="card">
            <div class="card-body">
                <form th:action="@{'/report/' + ${report.reportId} + '/generate'}" method="post">
                    <!-- Report Parameters -->
                    <div class="mb-4">
                        <h3>Report Parameters</h3>
                        <div th:each="param : ${params}" class="mb-3">
                            <label th:for="${param.paramId}" class="form-label" th:text="${param.paramName}">Parameter Name</label>
                            <input type="text" 
                                   class="form-control" 
                                   th:id="${param.paramId}"
                                   th:name="${param.paramId}"
                                   th:placeholder="'Enter ' + ${param.paramName}"
                                   th:required="${param.required}">
                            <div class="form-text" th:text="${param.description}">Parameter description</div>
                        </div>
                    </div>

                    <!-- Report Format -->
                    <div class="mb-4">
                        <h3>Report Format</h3>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="format" id="formatPdf" value="pdf" checked>
                            <label class="form-check-label" for="formatPdf">PDF</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="format" id="formatExcel" value="excel">
                            <label class="form-check-label" for="formatExcel">Excel</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="format" id="formatHtml" value="html">
                            <label class="form-check-label" for="formatHtml">HTML</label>
                        </div>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary">Generate Report</button>
                        <a th:href="@{/}" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
